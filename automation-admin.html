<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nandan Automation Admin</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:0 16px;color:#142747;background:#f3f7ff}input,button{padding:10px;border:1px solid #cbd8eb;border-radius:8px;margin:5px 0}button{background:#0b56bd;color:white;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:12px;border-radius:8px}.source{background:white;padding:12px;margin:10px 0;border-radius:10px}</style><h1>NANDAN Digital Seva — Automation Admin</h1><p>RSS मॉनिटर: पहले केवल सत्यापित सार्वजनिक RSS/API URL जोड़ें। हर वेबसाइट पर RSS/API उपलब्ध नहीं होता।</p><label>Admin token<br><input id="token" type="password" autocomplete="current-password" style="width:100%"></label><p><button onclick="loadSources()">सूची लोड करें</button> <button onclick="checkNow()">अभी फीड जाँचें</button></p><div id="sources"></div><pre id="out">Admin token डालकर सूची लोड करें।</pre><script>
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','x-admin-token':document.getElementById('token').value,...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loadSources(){try{const list=await fetch('/api/sources').then(r=>r.json());document.getElementById('sources').innerHTML=list.map(s=>'<section class="source"><b>'+s.name+'</b> — '+s.category+'<br><small>'+s.url+'</small><br><label>Verified RSS URL<br><input id="url-'+s.id+'" style="width:95%" placeholder="सत्यापित RSS URL"></label><br><label><input type="checkbox" id="enabled-'+s.id+'" '+(s.enabled?'checked':'')+'> Feed चालू करें</label><br><button onclick="saveSource(\''+s.id+'\')">सेव करें</button> <small>'+(s.configured?'RSS configured':'RSS URL नहीं जोड़ा गया')+'</small></section>').join('');document.getElementById('out').textContent='Source list loaded. यदि RSS URL बदलना हो तो URL भरें।'}catch(e){document.getElementById('out').textContent=e.message}}
async function saveSource(id){try{const rssUrl=document.getElementById('url-'+id).value.trim(),enabled=document.getElementById('enabled-'+id).checked,body={enabled};if(rssUrl)body.rssUrl=rssUrl;const d=await api('/api/admin/sources/'+id,{method:'PUT',body:JSON.stringify(body)});document.getElementById('out').textContent=JSON.stringify(d,null,2);loadSources()}catch(e){document.getElementById('out').textContent=e.message}}
async function checkNow(){try{const d=await api('/api/admin/check-now',{method:'POST',body:'{}'});document.getElementById('out').textContent=JSON.stringify(d,null,2)}catch(e){document.getElementById('out').textContent=e.message}}
</script></html>
