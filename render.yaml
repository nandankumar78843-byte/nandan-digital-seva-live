services:
  - type: web
    name: nandan-digital-seva
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: nandan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: CHECK_CRON
        value: "*/5 * * * *"
      - key: ADMIN_TOKEN
        generateValue: true
